<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Itens — Galeria da Jessica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="cabecalho">
    <nav class="navbar navbar-expand-md">
      <div class="container-fluid cabecalho-inner">
        <a class="navbar-brand logo-texto" href="index.html">🎨 Galeria da Jessica</a>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto mb-2 mb-md-0" id="menu-principal"></ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <section class="admin-card mb-4">
      <h2 class="secao-titulo">Cadastro de obras</h2>
      <form id="form-item" class="form-admin">
        <input type="hidden" id="item-id" />
        <input type="text" id="titulo" placeholder="Título da obra" required />
        <textarea id="descricao" rows="3" placeholder="Descrição curta" required></textarea>
        <textarea id="conteudo" rows="4" placeholder="Conteúdo completo"></textarea>
        <input type="text" id="categoria" placeholder="Categoria" required />
        <input type="text" id="imagem" placeholder="Caminho da imagem" required />
        <input type="text" id="tecnica" placeholder="Técnica" />
        <input type="text" id="dimensoes" placeholder="Dimensões" />
        <input type="date" id="data" />
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="destaque" />
          <label class="form-check-label" for="destaque">Marcar como destaque</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="principal" />
          <label class="form-check-label" for="principal">Marcar como obra principal</label>
        </div>
        <button type="submit" class="btn btn-destaque">Salvar obra</button>
      </form>
    </section>

    <section class="admin-card">
      <h3 class="mb-3">Obras cadastradas</h3>
      <div class="table-responsive">
        <table class="table table-admin">
          <thead>
            <tr>
              <th>Título</th>
              <th>Categoria</th>
              <th>Destaque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-itens"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>🎨 Galeria da Jessica &nbsp;|&nbsp; Desenvolvido por <strong>João Vitor Alves Araujo</strong></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
