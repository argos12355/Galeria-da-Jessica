<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Galeria da Jessica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="cabecalho">
    <nav class="navbar navbar-expand-md">
      <div class="container-fluid cabecalho-inner">
        <a class="navbar-brand logo-texto" href="index.html">🎨 Galeria da Jessica</a>
        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav ms-auto mb-2 mb-md-0" id="menu-principal"></ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <section class="row justify-content-center">
      <div class="col-lg-5">
        <div class="auth-card">
          <h2 class="secao-titulo">Entrar</h2>
          <form id="form-login" class="form-auth">
            <input type="text" id="login" name="login" placeholder="Usuário" required />
            <input type="password" id="senha" name="senha" placeholder="Senha" required />
            <button type="submit" class="btn btn-destaque">Entrar</button>
          </form>
          <p class="mt-3 text-center">
            Ainda não tem conta?
            <a href="cadastro.html" class="link-auth">Criar cadastro</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>🎨 Galeria da Jessica &nbsp;|&nbsp; Desenvolvido por <strong>João Vitor Alves Araujo</strong></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
